# Exemplar library — canonical "good RCA" reference shapes.
#
# Each entry is a curated archetype of a successful triage cycle, distilled
# from docs/happy-path-scenarios.md. The pipeline injects the best-matching
# exemplar into every LLM prompt before inference (see app/exemplars.py),
# so the model sees a quality target shaped to THIS alert's archetype.
#
# Entries are NOT real RCA records — they live in their own file, never
# in rca_history.db, so they don't pollute the dashboard, the feedback
# loop, or precision/recall metrics. The full prose version of each lives
# in docs/happy-path-scenarios.md (one anchor per id).
#
# Schema (per entry):
#   id              — short kebab-case key, also the doc anchor
#   archetype       — human-friendly label shown in the prompt
#   match           — selector dict; first-best wins (see app/exemplars.py)
#     alertname     — regex against alert.alertname (required)
#     services      — optional list of service labels OR ["*"]
#     deployment_types — optional list, e.g. ["k8s","docker-vm"]
#     signal        — optional, one of metric / log / trace / network
#     severity      — optional, list of severities to bias toward
#   decision        — ESCALATE | DISMISS (the canonical verdict for this
#                     archetype; the LLM is free to disagree if the actual
#                     evidence diverges)
#   confidence_band — typical confidence range as guidance
#   one_line        — one-sentence RCA gist; cheap-to-include version
#   human_cause     — added 2026-06-02: single plain-English sentence
#                     stating WHAT is broken (no PromQL, no formulas).
#                     This is what the email banner + dashboard "why" cell
#                     render verbatim. Operators read this first; mental
#                     load must be near zero. See app/prose_helpers.py.
#   rca             — model RCA paragraph, ~3-5 sentences. Match this
#                     STRUCTURE, not the facts.
#   evidence_shape  — list of evidence patterns the canonical RCA cited
#   actions_shape   — list of remediation patterns; the LLM should produce
#                     analogous state-changing commands for THIS alert
#   lesson          — one-line take-away, useful for the LLM to internalise
#   doc_anchor      — anchor in docs/happy-path-scenarios.md for full prose

exemplars:

  - id: oom-loop
    archetype: "JVM container OOM-kill loop"
    match:
      alertname: "^(Pod)?(High|Medium|Critical)MemoryUsage$"
      # WS-1 (2026-06-04): `employees-backend` is the new operator-facing
      # token from app.kubernetes.io/name + OTel service.name. The
      # `spring-boot*` aliases stay so historical alerts still match.
      services: ["employees-backend", "spring-boot", "spring-boot-app", "springboot-app"]
      deployment_types: ["k8s"]
      signal: "metric"
      severity: ["critical", "warning"]
    decision: "ESCALATE"
    confidence_band: "0.88-0.95"
    one_line: "JVM heap saturating cgroup limit because the JVM defaults aren't tuned for the container — OOM-kill cycle confirmed."
    human_cause: "employees-backend is in an OOM-kill loop, restarting every 12 minutes because the JVM heap is capped at only 256 MB."
    rca: |
      employees-backend is in a steady-state OOM-kill loop: every ~12 minutes the JVM heap
      exhausts, the kernel kills the container, and the pod restarts. The mechanism is
      a JVM-vs-cgroup mismatch — JAVA_TOOL_OPTIONS is unset so the JVM uses ~25% of the
      cgroup as heap (the default), which produces ~256 MB effective heap for a 1 GiB
      container limit. Normal traffic exhausts that. The metric proof:
      container_memory_working_set_bytes peaked near the cgroup limit in two saw-tooth
      cycles over 30 min; Loki shows multiple `java.lang.OutOfMemoryError: Java heap
      space` lines about 12 minutes apart matching the restart counter; GC pause time
      climbs in the 60-90s leading up to each crash. The cycle postdates the most recent
      deploy — the regression is recent.
    evidence_shape:
      - "container_memory_working_set_bytes peaked at X% of limit, repeating every ~N min"
      - "kube_pod_container_status_restarts_total = N (+M in last 30m)"
      - "K× 'java.lang.OutOfMemoryError: Java heap space' lines (Drain3 cluster #N, novel since HH:MM)"
      - "GC pause sum climbing in the 60-90 s before each OOM"
      - "Pattern starts at deploy timestamp"
    actions_shape:
      - "kubectl set resources deploy/{service} -n app --limits=memory=2Gi --requests=memory=1Gi — raise the ceiling out of OOMKill range"
      - "kubectl set env deploy/{service} -n app JAVA_TOOL_OPTIONS='-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError' — pin heap to 75% of cgroup, exit on OOM cleanly"
      - "kubectl rollout restart deploy/{service} -n app — clear leaked state after the limit change"
      - "If the leak persists post-restart: helm rollback {service} — revert while the leak is investigated"
    lesson: "Three pillars converged: memory metrics + OOM logs + GC-skewed traces. Drain3 added recency. Deploy timestamp tied it to a code change."
    doc_anchor: "scenario-1--spring-boot-oom-kill-loop-caught-in-a-single-cycle"

  - id: upstream-latency-attribution
    archetype: "API gateway p95 latency attributed to upstream service"
    match:
      alertname: "^High(Kong)?P95Latency.*$"
      services: ["kong"]
      deployment_types: ["k8s"]
      signal: "metric"
    decision: "ESCALATE"
    confidence_band: "0.88-0.95"
    one_line: "Kong is healthy; latency originates upstream — point the operator at the right service."
    human_cause: "Kong itself is fast; the slowness is in the upstream employees-backend service - operators should look there, not at Kong."
    rca: |
      Kong is the alert subject but not the cause: its own proxy time
      (kong_proxy_latency_ms p95) is single-digit milliseconds. Almost all of the
      reported end-to-end p95 is time spent inside the upstream service (commonly
      employees-backend), dominated by a single child operation — typically a MySQL query
      that's regressed or a downstream resource that's saturated. Trace evidence shows
      >95% of total request time in the upstream span; the kong span is a thin shim.
      The right intervention is in the upstream service (query plan, connection pool,
      thread pool), not in Kong's tuning. Calling this a "kong p95" issue would point
      the operator at the wrong layer.
    evidence_shape:
      - "kong_proxy_latency_ms p95 = X ms (Kong's own time, flat)"
      - "kong_http_request_duration_ms p95 = Y ms (total, including upstream)"
      - "Top N traces: Kong span ~Xms, upstream span Y-Zms — upstream dominates"
      - "Loki shows slow-query/slow-call lines in the upstream service"
    actions_shape:
      - "kubectl exec -n app deploy/{upstream_service} -- curl -s localhost:8080/actuator/metrics/<metric> — confirm the upstream-specific signal"
      - "Apply the schema/code/config fix in the UPSTREAM service (kubectl exec ... ALTER TABLE / kubectl set env / etc.)"
      - "kubectl rollout restart deploy/{upstream_service} -n app — bounce after the fix to clear stale caches"
    lesson: "Without traces, the LLM might blame the alert subject (Kong). Trace breakdown made the upstream attribution unambiguous."
    doc_anchor: "scenario-2--kong-p95-latency-spike-correctly-attributed-upstream-not-to-kong"

  - id: service-self-p95-saturation
    # Added 2026-04-28 (HighP95Latency investigation): when the alert subject IS
    # the slow service (not a gateway pointing upstream), the right framing is
    # "this service is saturated by [pool/GC/dependency]" — not the
    # upstream-latency-attribution shape. Without this exemplar, p95 alerts on
    # spring-boot scored only 0.60 against upstream-latency-attribution
    # (services=[kong]) and the LLM regressed to surface-level output.
    # PARTIALLY FORWARD-LOOKING: the `Critical` alternative in the alertname
    # regex covers a `CriticalP95Latency` rule that doesn't exist in
    # `alertrules.yml.j2` yet — kept so the archetype is ready when the
    # critical-tier latency rule lands (audit I-1, 2026-05-21).
    archetype: "Service p95 spike — the alerted service IS the bottleneck"
    match:
      alertname: "^(High|Critical)P95Latency$"
      # WS-1 (2026-06-04): `employees-backend` is the operator-facing alias.
      services: ["employees-backend", "spring-boot", "spring-boot-app", "springboot-app", "frontend"]
      deployment_types: ["k8s"]
      signal: "metric"
    decision: "ESCALATE"
    confidence_band: "0.78-0.92"
    one_line: "Service is saturated at one of: connection pool exhausted, GC pauses blocking threads, slow downstream call, or DB query plan regression — name which from the trace breakdown."
    human_cause: "employees-backend is saturated on its JDBC connection pool - requests are queueing for a free database connection instead of being served."
    rca: |
      The alerted service itself is the bottleneck — there is no upstream layer
      to redirect attribution to (unlike the Kong-says-upstream pattern). The
      diagnosis is "what inside this service is slow," and the trace breakdown
      will name it: a connection-pool-acquisition wait points at JDBC pool size;
      a long single-span on a downstream call points at a saturated dependency
      or query-plan regression; long gaps between spans point at JVM GC pauses;
      a uniform slowdown across spans points at thread-pool saturation. Logs
      will corroborate the first three (slow-query lines, "pool exhausted" /
      "thread pool full" templates, GC-pause lines); the trace alone is
      sufficient to choose between them. Do NOT explain p95 by quoting the
      observed value back as a description of "users experiencing slowness" —
      the alert already said that.
    evidence_shape:
      - "p95 = X ms (translate to plain language: '95% of requests took longer than X/1000 s')"
      - "Top N traces: longest single span = Y ms in <span name>; total = Z ms"
      - "If JDBC: hikari_active_connections / hikari_pending_threads ratio"
      - "If GC: jvm_gc_pause_seconds_sum trend over alert window"
      - "If thread pool: tomcat_threads_busy_threads / tomcat_threads_max"
      - "Loki: query template + frequency for slow-query / pool-exhausted / GC-pause lines"
    actions_shape:
      - "JDBC pool: kubectl set env deploy/{service} -n app SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE=40 — if traces show pool-acquisition waits"
      - "GC pauses: kubectl set env deploy/{service} -n app JAVA_TOOL_OPTIONS='-XX:+UseG1GC -XX:MaxGCPauseMillis=200' + kubectl rollout restart"
      - "Thread pool: kubectl set env deploy/{service} -n app SERVER_TOMCAT_THREADS_MAX=400 + kubectl rollout restart"
      - "Slow query: kubectl exec -n app deploy/mysql -- mysql -e 'EXPLAIN <slow query>' — capture plan; durable fix is index/query rewrite"
      - "If unclear from traces: kubectl rollout restart deploy/{service} -n app — cheapest reversible action to clear in-process state while diagnosis continues"
    lesson: "When the alert subject is the slow service, the trace breakdown is the diagnostic — not 'observed value above threshold'. The four common causes (pool, GC, downstream, query) each have a distinct trace signature."
    doc_anchor: "scenario-2--kong-p95-latency-spike-correctly-attributed-upstream-not-to-kong"

  - id: critical-resource-saturation
    # F-5 fix (audit 2026-04-28 PM): CriticalCpuUsage / CriticalMemoryUsage
    # had no exemplar — fell to generic-sre-shape. These are the
    # paged-immediately variants of the High* alerts. The right framing is
    # "this resource is genuinely exhausted right now" — different from
    # adaptive-threshold-noop (which dismisses seasonal CPU ramps).
    archetype: "Critical CPU/memory saturation on an application service — paged tier"
    match:
      alertname: "^(Pod)?Critical(Cpu|Memory)Usage$"
      # WS-1 (2026-06-04): `employees-*` are the operator-facing aliases.
      services: ["employees-backend", "employees-db", "employees-gateway", "spring-boot", "spring-boot-app", "springboot-app", "kong", "frontend", "k3s-node"]
      deployment_types: ["k8s", "systemd"]
      signal: "metric"
      severity: ["critical"]
    decision: "ESCALATE"
    confidence_band: "0.90-0.98"
    one_line: "A specific resource is exhausted — the cgroup limit, the JVM heap, or the host's physical memory. Name which from the metric breakdown."
    human_cause: "employees-backend is sitting at 98% of its memory cap for more than 5 minutes - the next request will trigger an OOM-kill."
    rca: |
      The host or pod has hit a hard resource ceiling — this is not seasonal
      noise. CriticalCpuUsage means the CPU has been at >90% for the rule's
      sustained window; CriticalMemoryUsage means the cgroup or host memory
      is near the limit. Diagnose by mechanism: for memory, check whether
      working_set is hugging the cgroup limit (OOMKill imminent — different
      from OS memory pressure); for CPU, check whether cpu_throttled_time
      is non-zero (pod throttling) vs across-the-host (noisy neighbour or
      genuine demand). Trace evidence shows whether the saturation
      originates from employees-backend's own request handling, a runaway batch
      job, or a sidecar (otel-agent, init-container). The right action is
      sized to the cause: raise the limit if normal load exceeded
      provisioning; rollback the deploy if a regression introduced the
      pressure; scale the deployment if traffic genuinely demands it.
    evidence_shape:
      - "container_memory_working_set_bytes / spec_memory_limit_bytes — peak %"
      - "container_cpu_cfs_throttled_seconds_total — non-zero means cgroup throttling"
      - "kube_pod_container_status_restarts_total — was the pod OOMKilled?"
      - "Loki: grep -i 'OutOfMemoryError|GC overhead|killed' for confirmation"
      - "Trace span breakdown: which operation dominates?"
    actions_shape:
      - "kubectl set resources deploy/{service} -n app --limits=memory=2Gi --requests=memory=1Gi — raise ceiling out of OOMKill range"
      - "kubectl set env deploy/{service} -n app JAVA_TOOL_OPTIONS='-XX:MaxRAMPercentage=75' — pin JVM heap to 75% of cgroup"
      - "kubectl scale deploy/{service} -n app --replicas=N — distribute load if traffic genuinely demands it"
      - "kubectl rollout undo deploy/{service} -n app — if a recent deploy caused the regression"
    lesson: "Critical-severity resource alerts mean the customer is in pain. Name a specific failing resource (cgroup memory cap, JVM heap default, CPU throttle), not 'the system is stressed'. Resize, rollback, or scale — match the action to the named cause."
    doc_anchor: "scenario-1--spring-boot-oom-kill-loop-caught-in-a-single-cycle"

  - id: otel-collector-degradation
    # F-5 fix (audit 2026-04-28 PM): both OTel collector alert rules
    # (OTelCollectorHighSpanDropRate, OTelCollectorDown) had no exemplar.
    # Real failure modes for the collector: backpressure (queue depth
    # growing), exporter timeouts, batch buffer overflow, OOM under load.
    # PARTIALLY FORWARD-LOOKING (audit 2026-04-29): regex names 4 alerts;
    # OTelCollectorHighSpanDropRate + OTelCollectorDown are provisioned in
    # alertrules.yml.j2; OTelCollectorHighQueueDepth + OTelCollectorHighMemoryUsage
    # are not yet provisioned but are expected to land when collector
    # observability matures (queue-depth gauge + memory-limit alarm).
    # Keep the regex broad so the archetype matches the day they ship.
    archetype: "OTel collector degradation — span drop rate or scrape down"
    match:
      alertname: "^OTelCollector(HighSpanDropRate|Down|HighQueueDepth|HighMemoryUsage)$"
      services: ["otel-collector", "otelcol", "*"]
      deployment_types: ["k8s", "docker-vm"]
      signal: "metric"
    decision: "ESCALATE"
    confidence_band: "0.85-0.95"
    one_line: "Collector is dropping spans / exporter blocked / batch buffer overflowing — name which exporter or upstream is causing backpressure."
    human_cause: "The OTel collector is dropping spans because its Jaeger exporter is slow - the receive queue is backing up."
    rca: |
      The OTel collector is failing to keep up with incoming telemetry. The
      diagnostic split: dropped spans means the receiver-side queue overflowed
      (incoming OTLP rate exceeds the collector's processing rate); a Down
      target means the collector itself is unreachable (OOM, crash, networking
      break). Backpressure usually traces to a slow exporter — Jaeger
      receiving slowly, or a remote write target (Prometheus, Loki) returning
      timeouts. Memory pressure on the collector pod ties to insufficient
      resources for the throughput it's seeing OR an exporter retry storm. The
      right action depends on the cause: tune the batch processor for
      higher throughput, scale the collector horizontally if it's a
      DaemonSet, or restart the slow exporter target.
    evidence_shape:
      - "otelcol_processor_dropped_spans_total — dropping rate ≥ N spans/s"
      - "otelcol_exporter_queue_size — queue depth per-exporter"
      - "otelcol_exporter_send_failed_spans_total — which exporter is failing"
      - "Loki: collector pod logs for 'queue full', 'export retry', 'context deadline'"
      - "Memory: container_memory_working_set on the collector pod"
    actions_shape:
      - "kubectl rollout restart daemonset/otel-collector -n observability — clears stuck queues"
      - "kubectl set env daemonset/otel-collector -n observability OTEL_BATCH_TIMEOUT=5s OTEL_BATCH_SEND_BATCH_SIZE=1024 — tune throughput"
      - "kubectl scale daemonset/otel-collector -n observability --replicas=N — if running as Deployment not DaemonSet"
      - "If exporter target is the bottleneck (Jaeger / Prometheus / Loki down): restart that target via the appropriate deployment_type"
    lesson: "The collector itself is rarely the cause — it's the canary. Find which exporter or upstream is back-pressuring before tuning collector resources."
    doc_anchor: "cross-cutting-properties-demonstrated-by-these-scenarios"

  - id: synthetic-blip-dismiss
    archetype: "Brief target-down / probe-miss with no corroborating signal"
    match:
      alertname: "^TargetDown$"
      services: ["*"]
      signal: "metric"
    decision: "DISMISS"
    confidence_band: "0.75-0.90"
    one_line: "Transient scrape collision or network jitter — target self-recovered before triage finished, no corroborating anomaly anywhere."
    human_cause: "Brief scrape blip on the target - it missed two checks then recovered on its own. No real outage."
    rca: |
      This is transient scrape jitter, not an outage: the target missed two consecutive
      scrape intervals, then recovered, and has been steadily up since — all of this
      before the triage pipeline finished gathering context. No alert correlated within
      ±5 minutes; no novel Drain3 log templates; host-level CPU/memory/network metrics
      show no perturbation in the window. The signature matches a brief network blip
      or a scrape-time collision (Prometheus and the target's own work overlapping in
      a way that blocks the scrape), not an actual service event. The right verdict is
      DISMISS without action — paging on this would be noise.
    evidence_shape:
      - "up{instance=...} time series: 1,1,...,0,0,1,1,1,... (two zeros, then recovery)"
      - "No correlated alerts in ±5m window"
      - "No novel Drain3 templates and no rate change"
      - "Host metrics (CPU, memory, network) unaffected"
    actions_shape: []   # DISMISS path: no remediation
    lesson: "Don't page on noise. Naming a specific cause ('transient scrape miss') is required even when the verdict is DISMISS — never write 'insufficient data' as the conclusion."
    doc_anchor: "scenario-3--synthetic-blip-dismissed-without-an-email"

  - id: cascade-incident-disk-loki
    archetype: "Cascade incident: 3-4 alerts collapsed into one kill-chain RCA"
    match:
      # I-4 (audit 2026-04-28): regex matches LokiIngestionRateLow.
      # F-5 widen 2026-04-28 PM: now also covers all disk-pressure variants
      # (Critical*, DiskFillingUp, LokiDiskFillingUp) so the 4 Loki / disk
      # alerts that previously fell through to generic-sre-shape now score
      # ≥0.90 against this exemplar.
      alertname: "^(HighDiskUsage|CriticalDiskUsage|DiskFillingUp|LokiHighDiskUsage|LokiCriticalDiskUsage|LokiDiskFillingUp|LokiIngestionRateLow|DatasourceNoData|AlertInhibitionTriggered)$"
      services: ["loki", "monitoring", "grafana", "prometheus"]
      deployment_types: ["docker-vm"]
    decision: "ESCALATE"
    confidence_band: "0.88-0.96"
    one_line: "Single root cause (disk pressure / ingest backpressure) produced N symptoms within ~12 min — treat as one incident, fix at the source."
    human_cause: "The monitoring VM disk is filling up, which is causing Loki to drop log ingest and Grafana to lose datasource visibility - one root cause, multiple symptoms."
    rca: |
      Multiple alerts in this window are symptoms of a single infrastructure-layer
      failure, not independent events: the chain starts at a saturated resource (the
      Loki disk filling up, write-ahead-log compaction stalling, network path
      degrading) and propagates through dependent services until a meta-alert fires.
      Disk pressure on monitoring-vm causes Loki to drop ingest, which causes
      LokiIngestionRateLow; Loki's slow responses to Grafana cause DatasourceNoData;
      enough downstream symptoms trip AlertInhibitionTriggered. The right intervention
      is at the saturated resource — remediating each downstream symptom individually
      wastes operator time and doesn't stop the chain.
    evidence_shape:
      - "Sub-alert 1: HH:MM <name> — first observable effect"
      - "Sub-alert 2: HH:MM+N <name> — downstream of 1 because <mechanism>"
      - "Sub-alert 3: HH:MM+M <name> — meta-alert / aggregate effect"
      - "Drain3 cluster '<root-cause-template>' rate spike from baseline X% to Y%"
    actions_shape:
      - "FIRST: cheap reversible remediation at the root (clear deletion-marker, restart loki, prune logs)"
      - "SECOND: restart the immediately-affected services to clear backed-up state"
      - "THIRD: durable fix only if the cheap remediation is insufficient (terraform apply -var <volume_size>)"
    lesson: "Order remediation by reversibility — cheap and reversible first, infrastructure changes last. Name the kill chain explicitly in the RCA."
    doc_anchor: "scenario-4--cascade-incident-4-alerts-collapsed-into-one-coherent-kill-chain-rca"

  - id: drain3-novelty-named-from-line
    # INTERNAL-WEBHOOK (audit 2026-05-22): Drain3AnomalyDetected is NOT a
    # Grafana alertrule — the drain3 background thread self-fires by POSTing
    # directly to `/webhook/drain3` (see `config.drain3_self_webhook_url` and
    # the drain3 worker loop in `app/drain3_runner.py`). The alert bypasses
    # Grafana's alert routing entirely (no alert history, no silences), so
    # audit Grafana-rule cross-references should SKIP this exemplar — its
    # lack of a matching `alertrules.yml.j2` entry is by design, not drift.
    #
    # REWRITTEN 2026-06-11 (fabricated-RCA incident): the previous version
    # told a deploy-regression story with unfilled placeholders (N minutes,
    # cluster #N, HH:MM, helm rollback actions) and a 0.82-0.92 band. The
    # platform has NO deploy data source (no bridge knows about rollouts),
    # so the model copied an unfalsifiable cause verbatim — placeholders
    # included — while the REAL cause ("Product Catalog Fail Feature Flag
    # Enabled") sat in the novel line it ignored. This version is structural:
    # the cause comes FROM the line, external-event claims are forbidden
    # without evidence, and confidence scales with how explicitly the line
    # names its cause.
    archetype: "Drain3 novel log template — cause named from the line itself"
    match:
      alertname: "^Drain3AnomalyDetected$"
      services: ["*"]
      signal: "log"
    decision: "ESCALATE"
    confidence_band: "0.50-0.85"
    one_line: "A never-before-seen log template appeared; the cause is almost always written IN the line — quote it, name it, never guess an external event."
    human_cause: "<one sentence that QUOTES or directly paraphrases the decisive novel line — e.g. 'product-catalog is failing because its fail feature flag is enabled' — never a guessed external event>"
    rca: |
      Lead with what the novel template itself says: the decisive evidence for a
      Drain3 fire is the verbatim line, and the cause is usually written in it
      (a named exception, a feature flag, a refused connection, a missing config).
      Quote or closely paraphrase the line, then state what it means for the
      service. Cross-reference the three pillars scoped to the EMITTING service
      and report what they actually returned — "metrics are silent" is only a
      finding if you checked. DO NOT attribute the anomaly to a deploy, rollout,
      release or any external event unless evidence of that event is present in
      the gathered context: this platform has no deploy data source, so an
      unsupported "recent deploy introduced this" is a fabrication, not a
      diagnosis. Confidence scales with the line: a line that names its own cause
      supports high confidence; a cryptic novel line supports a lower-confidence
      named hypothesis plus a concrete verification step.
    evidence_shape:
      - "Verbatim novel template(s), quoted exactly as Drain3 captured them"
      - "Which service(s) emitted the lines, and the novelty rate / line count"
      - "What each pillar returned when scoped to the emitting service (including honest empties)"
    actions_shape:
      - "The action the line itself implies (e.g. disable the named feature flag, fix the named config)"
      - "One concrete verification command an operator can run against the emitting service"
    lesson: "For log-novelty alerts the cause is usually IN the line. Quote it. Never assert an external event (deploy, rollout) the evidence cannot show."
    doc_anchor: "scenario-5--drain3-self-fires-on-a-novel-post-deploy-error-template"
  - id: bounded-agency-resolves-inconclusive
    # FORWARD-LOOKING (audit 2026-04-28): regex names HighErrorRate /
    # HighFrontendErrorRate, neither of which is a provisioned Grafana
    # rule yet. This exemplar will activate once those rules ship via
    # monitoring-project. Until then it is reachable only through
    # explicit `get_by_id` from the bounded-agency tool path.
    # FORWARD-LOOKING
    archetype: "First pass INCONCLUSIVE; one extra MCP query resolves to ESCALATE"
    match:
      alertname: "^High(Frontend)?ErrorRate$"
      services: ["frontend"]
      signal: "metric"
    decision: "ESCALATE"
    confidence_band: "0.78-0.88"
    one_line: "Frontend 5xx rate is the symptom; the upstream is admission-rejecting requests (saturated thread/connection pool or tripped circuit breaker)."
    human_cause: "Frontend is returning 5xx because the upstream service is rejecting requests at admission - its thread pool or circuit breaker is saturated."
    rca: |
      The frontend's 5xx rate is the user-visible symptom; the actual failure is one
      hop upstream. Initial evidence in the alerting service was thin (error rate up,
      but few traces and minimal logs there because the requests don't get far enough
      to log anything). A bounded-agency MCP retry pulled K traces from the upstream
      service and showed the diagnostic pattern: most upstream calls return 5xx in
      <50ms — too fast to be timeouts, which means the upstream is rejecting at
      admission rather than failing during work. That admission-time rejection
      signature points to one of three saturation modes: tomcat thread pool exhausted,
      circuit-breaker tripped, or HTTP connection pool drained. The frontend itself
      is healthy by other metrics; it is faithfully forwarding the upstream's "no" to
      users.
    evidence_shape:
      - "Initial: error rate up from baseline; alerting service traces empty"
      - "Bounded-agency tool: jaeger.get_traces(service={upstream}, status=503, limit=25)"
      - "K of N retrieved upstream traces returned 5xx in <50ms — admission-time rejection"
      - "{service} itself is healthy by other metrics"
    actions_shape:
      - "kubectl exec -n app deploy/{upstream} -- curl -s localhost:8080/actuator/metrics/<saturation_metric> — capture the smoking gun (still allowed because it changes nothing but proves the cause)"
      - "kubectl set env deploy/{upstream} -n app SERVER_TOMCAT_THREADS_MAX=400 — raise saturation ceiling if confirmed"
      - "kubectl rollout restart deploy/{upstream} -n app — apply env change cleanly"
    lesson: "A targeted single retry > scolding the model. Determinism is preserved (same inputs → same retry → same answer)."
    doc_anchor: "scenario-6--bounded-agency-retry-from-inconclusive-to-escalate-in-one-extra-mcp-query"

  - id: adaptive-threshold-noop
    archetype: "Adaptive-threshold rule absorbs a known seasonal traffic spike"
    match:
      alertname: "^(Pod)?(High|Medium)CpuUsage$"
      services: ["*"]
      signal: "metric"
    decision: "DISMISS"
    confidence_band: "0.80-0.95"
    one_line: "Static-threshold blind spot to traffic seasonality — current value is a normal time-of-day ramp, not a degradation."
    human_cause: "Normal time-of-day traffic ramp - same pattern as the prior 4 weeks at this hour. The alert rule's static threshold is the problem, not the system."
    rca: |
      This is the static threshold misfiring on a normal traffic ramp, not a real
      degradation: the current value is +0.4σ above the same-hour baseline from one
      week ago (stddev_over_time + offset 7d), well within the natural seasonality of
      the load curve. The shape matches the prior 4 weeks at this same day-of-week
      and time-of-day — Tuesday-9am and Thursday-2pm both look like this, every week.
      Logs and traces are quiet — no error rate change, no novel templates, no slow
      spans. The alert is signal about the rule design (static threshold can't track
      traffic seasonality), not about the system's actual health. Firing-but-no-action
      patterns like this are how operators learn to ignore alerts; the right response
      is to fix the rule.
    evidence_shape:
      - "Current: X% (above static threshold T%)"
      - "Same-hour-same-day baseline (last 7d): mean X'%, σ Y%"
      - "Z-score: (X - X') / Y = +N.Mσ (within ±1σ band)"
      - "No log or trace anomaly in window"
    actions_shape:
      - "Edit monitoring-project/roles/grafana/templates/alertrules.yml.j2: replace static threshold with stddev_over_time + offset 7d > 3 — remediates the false-positive class durably"
      - "ansible-playbook -i inventory/tailnet.yml playbooks/grafana.yml — apply the rule change"
    lesson: "The right output for a seasonal spike is to FIX THE RULE, not to page. Operating quiet on non-events is as valuable as catching real ones."
    doc_anchor: "scenario-7--adaptive-threshold-us-54-keeps-the-system-quiet-through-a-normal-tuesday-morning-ramp"

  - id: closed-loop-feedback-override
    archetype: "Operator override on a similar prior alert forces escalation"
    match:
      # Sentinel regex: this archetype is gated on a runtime signal (the
      # pre-LLM suppressor finding a recent matching operator override).
      # It is NOT a property of the alert itself, so we don't want it to
      # auto-match by alertname. The pipeline fetches this exemplar
      # explicitly by id (`get_by_id("closed-loop-feedback-override")`)
      # when the override flag is set on an incoming alert.
      alertname: "^__pipeline_explicit__$"
      services: ["*"]
    decision: "ESCALATE"
    confidence_band: "0.65-0.85"
    one_line: "Operator override on a recent similar alert reverses the LLM's DISMISS — escalating for human review per the standing override policy."
    human_cause: "An on-call engineer recently flagged a similar alert as a real incident - this fire is being escalated to honour that operator decision."
    rca: |
      The override is the cause of the escalation, not the alert content itself. The
      LLM's first-pass verdict was DISMISS (the alert matches a known seasonal pattern,
      e.g. weekend batch ETL), and on a typical day this would have stopped at the
      pre-LLM gate. However, an on-call engineer recently flagged a similar alert
      (alertname match + ±2h time-of-day match + same service) as a real incident
      via /feedback/override, and that override is still in its active window. The
      pipeline is honouring that operator decision: similar future fires escalate
      pending fresh human review. If this firing is genuinely routine, the
      /feedback/confirm endpoint down-weights the override; if it is real, the next
      /feedback/override reinforces it. The system is learning from operator decisions
      — the routing reflects the most recent ground truth, not the LLM's judgement
      alone.
    evidence_shape:
      - "LLM verdict (this pass): DISMISS, confidence ~0.79"
      - "Recent operator override: <YYYY-MM-DD>, similarity=high (alertname + time-of-day + service)"
      - "Override window active for next K days"
    actions_shape:
      - "Investigate the live alert as if ESCALATE: do the normal RCA-driven remediation steps"
      - "If the alert is genuinely routine: POST /feedback/confirm — down-weights the standing override"
      - "If real: POST /feedback/override (with operator_note) — reinforces the override policy"
    lesson: "The system doesn't just consume LLM verdicts; it learns from operator decisions. Pre-LLM similarity check + post-LLM gate together produce the closed loop."
    doc_anchor: "scenario-8--closed-loop-feedback-us-53-operator-override-teaches-the-system"

  - id: crashloop-bad-config
    # PARTIALLY FORWARD-LOOKING (audit 2026-04-28): regex names
    # KubePodCrashLooping which is not yet a provisioned Grafana rule
    # (the existing platform catches CrashLoopBackOff via TargetDown
    # because the pod's scrape target goes down too). The
    # KubePodCrashLooping alternative will activate when a
    # `kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}`
    # rule ships.
    # FORWARD-LOOKING
    archetype: "App boot failure / CrashLoopBackOff from a bad config or migration"
    match:
      alertname: "^(KubePodCrashLooping|TargetDown)$"
      # WS-1 (2026-06-04): `employees-*` are the operator-facing aliases.
      services: ["employees-backend", "employees-db", "employees-gateway", "spring-boot", "spring-boot-app", "springboot-app", "kong", "frontend"]
      deployment_types: ["k8s"]
      signal: "metric"
    decision: "ESCALATE"
    confidence_band: "0.92-0.98"
    one_line: "Recent config / migration change broke the boot path — every restart aborts at the same boot step before the work loop starts."
    human_cause: "Recent config change broke the boot path - the pod restarts, fails at the same line, and crash-loops. No traffic is being served."
    rca: |
      The pod can't get through its boot phase: it restarts, executes a few seconds of
      bootstrap code, hits a precise error at a specific boot step, and the kernel
      cycles it again. The repeating boot-step error is the cause; CrashLoopBackOff
      and the eventually-firing TargetDown are downstream symptoms of "no working pod
      ever exists". Logs show every restart terminating at the same line — a
      Liquibase migration that can't apply, a config-file parse that fails, an env-var
      validator that rejects an empty value, or a Spring bean that fails to wire. The
      Drain3 cluster for that exact error is brand-new since the most recent rollout
      (i.e., the bad change is in this revision). Memory and CPU never climb because
      the pod never reaches the work loop. User-facing endpoints fronted by this
      service are returning upstream errors because the upstream simply doesn't exist
      right now.
    evidence_shape:
      - "kube_pod_container_status_restarts_total rate(5m)*300 = N (staircase shape)"
      - "kube_pod_status_phase{phase='Waiting',reason='CrashLoopBackOff'} = 1"
      - "Loki: every restart ends with '<specific boot-step error>' (Drain3 cluster #N novel since HH:MM)"
      - "0 traces — pod never accepted requests"
    actions_shape:
      - "kubectl rollout undo deploy/{service} -n app — fastest restore-to-service, reverts to prior revision"
      - "After service is restored: git revert <commit-sha> in the source-of-truth repo, push, then re-apply via the GitOps path (ansible-playbook ...)"
      - "Add a structural guard: helm chart pre-install/pre-upgrade hook for migrations / config validation"
    lesson: "CrashLoopBackOff is one of the most common production failures. Rollback first (restore service), fix forward through GitOps second (auditable), structural improvement third."
    doc_anchor: "scenario-9--app-boot-failure--crashloopbackoff-from-a-bad-config-map"

  - id: oom-crashloop-restart
    # Added 2026-06-10 with the namespace-generic PodCrashLooping rule
    # (monitoring-project c6dbf81) after decision 29a05711 hedged on a real
    # OOM loop. Keyed on the restart-counter alert shape; services "*"
    # because the rule is namespace-generic (otel-demo, app, rental, ...).
    # Placed AFTER crashloop-bad-config so on score ties for the employees-*
    # services the established boot-failure exemplar still wins.
    archetype: "Container OOM-kill restart loop named via termination-reason evidence"
    match:
      alertname: "^(Kube)?PodCrashLooping$"
      services: ["*"]
      deployment_types: ["k8s"]
    decision: "ESCALATE"
    confidence_band: "0.70-0.90"
    one_line: "Container is OOMKilled every cycle — memory limit too small for the workload; restart counter staircases until the limit is raised."
    human_cause: "accounting is being OOMKilled about every 17 minutes - its 120Mi memory limit is too small for the workload, so the kernel kills it and the pod restarts."
    rca: |
      The pod is in a kernel-enforced OOM-kill loop: the container's working set
      grows past its cgroup memory limit, the kernel kills it (exit 137), kubelet
      restarts it, and the cycle repeats. The verdict lives in ONE series —
      kube_pod_container_status_last_terminated_reason has reason="OOMKilled" for
      this pod (KSM labels arrive as exported_namespace/exported_pod/exported_container
      on this platform). The restart counter staircases (+N per hour) while the loop is
      active. Note the trailing-window nuance: the alert fires on increase(...[1h]),
      so if the recent-window restart increase is ~0 and the pod is healthy, the loop
      ALREADY ENDED (e.g. an operator raised the limit) — then the correct verdict is
      DISMISS with the ended breach NAMED, not "cannot determine". Current-state
      health is not evidence of "no anomalies" for a retrospective restart alert.
    evidence_shape:
      - "kube_pod_container_status_last_terminated_reason{exported_pod=~'{service}.*', reason='OOMKilled'} = 1"
      - "increase(kube_pod_container_status_restarts_total{exported_pod=~'{service}.*'}[2h]) = N (staircase)"
      - "kube_pod_container_resource_limits{resource='memory'} = X Mi vs container_memory_working_set_bytes hugging X"
      - "Logs often CLEAN — the kernel kills the process mid-flight; absence of app errors does NOT mean absence of cause"
    actions_shape:
      - "kubectl -n {namespace} set resources deploy/{service} --limits=memory=<2-4x current> — lift the ceiling out of OOMKill range"
      - "Persist the new limit through the GitOps path (helm values / ansible) so the next deploy doesn't regress it"
      - "Watch increase(kube_pod_container_status_restarts_total[30m]) flatten to 0 to confirm remediation"
      - "If the working set keeps growing after the bump: memory leak — capture a heap profile and helm rollback to the last good revision"
    lesson: "Restart alerts are retrospective: name the kill reason from last_terminated_reason, check whether the loop is STILL active, and never read current-state calm as 'no anomalies'."
    doc_anchor: "scenario-1--spring-boot-oom-kill-loop-caught-in-a-single-cycle"

  - id: network-firewall-attribution
    # PARTIALLY FORWARD-LOOKING (audit 2026-04-28): regex names
    # HighKongUpstreamErrorRate / HighFrontendErrorRate which are not
    # yet provisioned. HighKongP95Latency and TargetDown are live;
    # the others activate when the missing rules ship.
    # FORWARD-LOOKING
    archetype: "Connectivity break (security group / firewall / network policy) misattributed to app failure"
    match:
      alertname: "^(HighKongUpstreamErrorRate|HighKongP95Latency|HighFrontendErrorRate|TargetDown)$"
      services: ["kong", "frontend", "*"]
      signal: "network"
    decision: "ESCALATE"
    confidence_band: "0.82-0.92"
    one_line: "A recent infrastructure change (terraform apply / SG / NetworkPolicy) is blocking previously-allowed traffic — the app layer is healthy, the path between layers is severed."
    human_cause: "A recent infrastructure change cut the network path between the gateway and its upstream service - the apps are healthy but cannot reach each other."
    rca: |
      This is a network-layer break, not an application failure: a recent
      infrastructure change has revoked previously-allowed traffic between two
      services that the app layer still expects to reach. The diagnostic split is
      what makes this readable — Kong (or the alerting service) sees connect-timeout
      / connect-reset on its upstream connection and surfaces 5xx; meanwhile the
      apparent target (employees-backend) is reporting healthy by its own metrics
      (up{}=1, application thread pools idle) and Loki shows zero inbound requests
      landing in the target during the alert window. Jaeger confirms the gap
      explicitly: kong spans show connect-timeout, no child spans appear in the
      target. node_network_transmit_packets_total drops K% at the same minute as the
      most recent terraform apply / NetworkPolicy edit / SG modification. The fix is
      at the network layer (revert the IaC change, restore the CIDR/policy), not at
      either application.
    evidence_shape:
      - "kong_upstream_target_health{upstream='{target}'} flipped 1→0 at HH:MM"
      - "up{job='{target}'}=1 — target is healthy at the application layer"
      - "Loki on {target}: silent in alert window — no inbound requests landing"
      - "Jaeger: kong spans show connect-timeout / connect-reset; no child spans in {target}"
      - "node_network_transmit_packets_total: K% drop at HH:MM (coincident with terraform apply at HH:MM-N)"
    actions_shape:
      - "Confirm the diff: cd {iac_repo} && terraform plan -target=module.{module} — non-destructive"
      - "RESTORE SERVICE: terraform apply with the prior CIDR/policy values (cheap, reversible) — clears 5xx in <30s"
      - "FIX FORWARD: git revert <commit-sha> on the change in {iac_repo}, push, re-apply through CI"
      - "GUARD: add OPA/Conftest policy in .github/workflows/terraform.yml that fails any plan narrowing intra-cluster CIDRs"
    lesson: "Single-pillar metrics say 'target is up' — but the trace + log + packet-rate combination is the whole story. Restore-of-service before root-cause diagnosis under outage. Always check the IaC commit log."
    doc_anchor: "scenario-10--aws-security-group-change-silently-blocks-kong--spring-boot"

  - id: tls-cert-expiry-pre-failure
    # FORWARD-LOOKING (audit 2026-04-28): regex names alerts
    # (TLSCertExpiringSoon / CertificateExpiry / ProbeSSL*) that are
    # not yet provisioned anywhere in the platform. Activates when a
    # blackbox-exporter or cert-manager-based expiry rule ships.
    # FORWARD-LOOKING
    archetype: "Pre-failure TLS / cert expiry caught before user impact"
    match:
      alertname: "^(TLSCertExpiringSoon|CertificateExpiry|ProbeSSL.*)$"
      services: ["*"]
      signal: "metric"
      severity: ["warning"]
    decision: "ESCALATE"
    confidence_band: "0.88-0.96"
    one_line: "cert-manager has been silently failing renewal for K days because the ACME challenge path is broken — act now while the cert is still serving."
    human_cause: "cert-manager has not been able to renew the TLS cert for several days - the cert is still serving today, but will expire soon if not fixed."
    rca: |
      The renewal pipeline is the failing component, not the cert itself. cert-manager
      has been unable to renew this certificate for K days — cert_manager_certificate_ready_status
      has been 0 since YYYY-MM-DD, and Drain3 has a novel renewal-failure log template
      from the same date with M recurrences. The cert is still serving fine right now
      (probe_success=1), which is exactly why this kind of pre-failure alert is
      valuable: there is still time to fix the renewal pipeline before the cert
      actually expires and users see broken HTTPS. The most likely cause is an
      ingress / route change that broke the ACME HTTP-01 challenge URL — recent
      monitoring-project / k3s-images commits should be inspected for ingress
      modifications. Days remaining: N (computed from probe_ssl_earliest_cert_expiry).
    evidence_shape:
      - "probe_ssl_earliest_cert_expiry → N days remaining (declining linearly)"
      - "cert_manager_certificate_ready_status{name='...'} = 0 since YYYY-MM-DD"
      - "Drain3: novel renewal-failure cluster, M recurrences"
      - "probe_success = 1 — endpoint still serving (pre-failure window)"
    actions_shape:
      - "kubectl rollout restart deploy/cert-manager -n cert-manager — kick a fresh renewal"
      - "kubectl annotate certificate {name} -n {ns} cert-manager.io/issue-temporary-certificate='true' --overwrite — buy headroom with a temporary cert"
      - "Restore the broken challenge path: git revert <commit-sha> on the ingress/route edit, then ansible-playbook ..."
      - "Add a redundant alert at expiry < 14 days (lead time) by editing alertrules.yml.j2 + ansible-playbook playbooks/grafana.yml"
    lesson: "Pre-failure alerts are gold — fire while everything still works. The right action sequence buys time (temporary cert) before fixing the root cause."
    doc_anchor: "scenario-11--tls-certificate-near-expiry-caught-before-users-see-a-single-failure"


# Default exemplar (fallback when nothing matches well). Generic SRE
# template that prompts the LLM to do the right shape regardless of
# alert specifics.
default:
  id: generic-sre-shape
  archetype: "Generic three-pillar RCA"
  one_line: "Lead with a NAMED cause; cite metrics/logs/traces in support; rank remediation cheap-and-reversible first."
  human_cause: "<one plain-English sentence: what is broken in human prose - no PromQL, no formulas, no metric=value strings>"
  rca: |
    Name the failing component or mechanism in the first sentence — a saturated pool,
    a stalled process, a config drift, a recent deploy regression, an exhausted disk,
    a broken upstream link. Then explain HOW you know: which metric values, which
    log templates, which trace span breakdowns, which pillar is silent and why. Use
    plain language for raw expressions (translate "p95 = 8487 ms" into "95% of
    requests took longer than 8.5 seconds"); the raw form goes in evidence. Finish
    with 2-4 concrete state-changing remediations ordered by reversibility — cheap
    reverts first, infrastructure-level changes last. Never let "value above
    threshold" be the conclusion; that is the alert restating itself.
  evidence_shape:
    - "Observed value (with unit + delta from threshold)"
    - "One specific log line OR Drain3 cluster reference"
    - "One specific trace ID / span name OR the pillar's silence with reason"
  actions_shape:
    - "kubectl rollout restart deploy/{service} -n app (or docker compose restart, depending on deployment_type)"
    - "Configuration / resource change appropriate to the named cause"
    - "Durable structural fix only if the immediate remediation is insufficient"
  lesson: "Even without a perfect archetype match, follow the shape: observed value → cross-pillar verification → mechanism → ordered remediation."
  doc_anchor: "cross-cutting-properties-demonstrated-by-these-scenarios"
