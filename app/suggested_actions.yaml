# Action templates for the triage service — REMEDIATION-FIRST.
#
# When the LLM's `suggested_actions` is empty (or all entries are rejected by
# response_validator for being investigations rather than fixes), the pipeline
# falls back to these templates keyed by alertname pattern.
#
# PHILOSOPHY (changed 2026-04-27 after Lina's audit feedback): every template
# action MUST be a state-changing remediation. The triage service has full
# read access to Prometheus / Loki / Jaeger / Drain3 via its MCP servers — it
# already gathers that data and presents it in `evidence` and `rca`. Asking
# the operator to re-run the same queries the system already ran is useless.
# Operators want a fix, not a homework assignment.
#
# Acceptable verbs: kubectl rollout restart / kubectl scale / kubectl set
# resources / kubectl set env / kubectl patch / kubectl delete pod / helm
# rollback / docker restart / docker compose restart / docker compose up
# -d --force-recreate / systemctl restart / systemctl reload / kill / git
# revert / terraform apply.
#
# UNACCEPTABLE: kubectl get / kubectl describe / kubectl top / kubectl logs /
# docker logs / docker ps / docker stats / df / du / ps / top / "Query
# Grafana" / "Check ..." / "Verify ..." / "Investigate ..."
#
# Templates are deployment-type aware — kubectl actions are wrong for a
# Grafana-on-docker-compose service, so each alert is keyed by the deployment
# type returned by app.config.service_deployment_type.
#
# Placeholder substitution (see app/action_templates.py):
#   {instance}        — raw "ip:port" from alert.labels["instance"]
#   {instance_host}   — friendly hostname from settings.instance_hosts
#   {service}         — alert.labels["service"]
#   {grafana}         — settings.grafana_url
#   {job}             — alert.labels["job"] if present
#
# First matching rule wins. Keep specific patterns above catch-all defaults.

rules:

  # ---- CPU alerts ------------------------------------------------------
  # CPU pressure remedies are: scale horizontally, scale vertically (raise
  # cpu limit), restart leaking pod, or drain hot node and let scheduler
  # rebalance. We don't OOM-kill specific processes in templates because we
  # don't have a PID — the LLM can do that when it has a process name in
  # evidence.
  - match: "^(High|Medium|Critical)CpuUsage$"
    by_deployment_type:
      k8s:
        - "kubectl scale deploy/{service} -n app --replicas=$(($(kubectl get deploy/{service} -n app -o=jsonpath='{.spec.replicas}')+1)) — add a replica to relieve load"
        - "kubectl rollout restart deploy/{service} -n app — clear in-process leaks"
        - "kubectl set resources deploy/{service} -n app --limits=cpu=1500m --requests=cpu=500m — bump CPU ceiling if pods are throttled"
      systemd:
        - "ssh deploy@{instance_host} 'sudo systemctl restart node-exporter prometheus' — recover any wedged daemons"
        - "If a single process dominates: ssh deploy@{instance_host} 'sudo kill <PID>' (PID identified in evidence)"
        - "If sustained: terraform apply -target=module.<host> with a larger instance_type — current size is saturated"
      docker-vm:
        - "ssh deploy@{instance_host} 'docker compose -f /opt/monitoring/compose.yml restart' — recycle compose stack"
        - "If a single container is the source: ssh deploy@{instance_host} 'docker restart <name>' (name in evidence)"
      unknown: []

  # ---- Memory alerts ---------------------------------------------------
  # Memory pressure usually means: limit too low, leak in-process, or both.
  # The right fix is raise limit + restart to reset state. JVM-specific
  # alerts get an extra heap-tuning entry.
  - match: "^(High|Medium|Critical)MemoryUsage$"
    by_deployment_type:
      k8s:
        - "kubectl set resources deploy/{service} -n app --limits=memory=2Gi --requests=memory=1Gi — raise the ceiling out of OOMKill range"
        - "kubectl rollout restart deploy/{service} -n app — clear accumulated state after the limit change"
        - "If Java service: kubectl set env deploy/{service} -n app JAVA_TOOL_OPTIONS='-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError' — pin heap to 75% of cgroup, force exit on OOM"
      systemd:
        - "ssh deploy@{instance_host} 'sudo systemctl restart <service>' (service name in evidence)"
        - "If a leaking process: ssh deploy@{instance_host} 'sudo kill <PID>' (PID in evidence)"
      docker-vm:
        - "ssh deploy@{instance_host} 'docker restart <container>' (container name in evidence)"
        - "Edit /opt/monitoring/compose.yml: raise the container's `mem_limit`, then `docker compose up -d --force-recreate <container>`"
      unknown: []

  # ---- Disk alerts -----------------------------------------------------
  # Disk pressure: prune images/logs first (cheap and reversible), expand
  # volume only if pruning isn't enough.
  - match: "^(High|Critical|DiskFilling).*(DiskUsage|Up).*$"
    by_deployment_type:
      k8s:
        - "ssh deploy@{instance_host} 'sudo journalctl --vacuum-size=200M' — trim systemd journal (often the largest log dir)"
        - "ssh deploy@{instance_host} 'sudo crictl rmi --prune' — remove unused container images"
        - "If still > 80% after prune: terraform apply -var k3s_root_volume_gb=<larger> -target=module.k3s — expand EBS volume"
      systemd:
        - "ssh deploy@{instance_host} 'sudo journalctl --vacuum-size=200M' — trim journal"
        - "ssh deploy@{instance_host} 'sudo logrotate -f /etc/logrotate.conf' — force log rotation"
      docker-vm:
        - "ssh deploy@{instance_host} 'docker system prune -af --volumes' — remove unused images/volumes"
        - "If still > 80% after prune: terraform apply -var monitoring_root_volume_gb=<larger> — expand EBS"
      unknown: []

  # ---- TargetDown / service down --------------------------------------
  # The service is unreachable. The only universal remedy is "restart the
  # thing." The LLM should put which thing in the rca so the operator can
  # paste in the right name.
  - match: "^TargetDown$"
    by_deployment_type:
      k8s:
        - "kubectl rollout restart deploy/{service} -n app — restart the deployment to bring the pod back to a clean state"
        - "If pod stays NotReady: kubectl delete pod -l app.kubernetes.io/name={service} -n app — force pod recreation"
        - "If readiness probe is the cause (in evidence): kubectl patch deploy/{service} -n app --patch='{{\"spec\":{{\"template\":{{\"spec\":{{\"containers\":[{{\"name\":\"{service}\",\"readinessProbe\":{{\"timeoutSeconds\":15}}}}]}}}}}}}}' — relax probe"
      systemd:
        - "ssh deploy@{instance_host} 'sudo systemctl restart {service}' — restart the daemon"
        - "If the unit is failed: ssh deploy@{instance_host} 'sudo systemctl reset-failed {service} && sudo systemctl start {service}'"
      docker-vm:
        - "ssh deploy@{instance_host} 'docker restart <container>' — restart the container (name visible in evidence; usually matches the service label)"
        - "If the container is gone: ssh deploy@{instance_host} 'cd /opt/monitoring && docker compose up -d <container>' — recreate from compose"
      unknown:
        - "Identify the service's deployment type from the alert labels, then restart at that layer (kubectl rollout restart / systemctl restart / docker restart)"

  - match: "^OTelCollectorDown$"
    by_deployment_type:
      k8s:
        - "kubectl rollout restart daemonset/otel-collector -n observability — recycle the collector across all nodes"
        - "If pods stay unhealthy: kubectl delete pod -l app.kubernetes.io/component=otel-collector -n observability — force-recreate"
      docker-vm:
        - "ssh deploy@{instance_host} 'docker restart otel-collector'"

  # ---- Latency alerts --------------------------------------------------
  # Latency rarely fixes itself. Standard plays: restart for connection-pool
  # / GC-arena leaks, scale out for capacity, raise resource limits if
  # GC/CPU-bound.
  - match: "^HighP95Latency$"
    by_deployment_type:
      k8s:
        - "kubectl rollout restart deploy/{service} -n app — clears connection-pool leaks (most common p95 cause for Java services)"
        - "kubectl scale deploy/{service} -n app --replicas=$(($(kubectl get deploy/{service} -n app -o=jsonpath='{.spec.replicas}')+1)) — add a replica to spread request load"
        - "If Java GC pauses are visible in traces: kubectl set resources deploy/{service} -n app --limits=memory=2Gi (raise heap headroom) and `kubectl set env deploy/{service} -n app JAVA_TOOL_OPTIONS='-XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:MaxGCPauseMillis=200'`"

  - match: "^HighKongP95Latency$"
    by_deployment_type:
      k8s:
        - "kubectl rollout restart deploy/kong-kong -n network — recycle Kong workers (sheds in-process state)"
        - "kubectl scale deploy/kong-kong -n network --replicas=2 — current 1 replica is the bottleneck for gateway throughput"
        - "If upstream timeouts are visible in evidence: kubectl set env deploy/kong-kong -n network KONG_PROXY_READ_TIMEOUT=30000 KONG_PROXY_SEND_TIMEOUT=30000 — raise upstream timeouts"

  # ---- OTel span drop rate --------------------------------------------
  - match: "^OTelCollectorHighSpanDropRate$"
    by_deployment_type:
      k8s:
        - "kubectl rollout restart daemonset/otel-collector -n observability — clear stuck pipelines"
        - "If memory limit is the cause (visible in evidence): kubectl set resources daemonset/otel-collector -n observability --limits=memory=512Mi"
        - "If exporter backpressure: edit otel-collector ConfigMap to raise `processors.batch.send_batch_size` (currently default 8192) — flush smaller batches faster"

  # ---- Loki ingestion / storage ---------------------------------------
  - match: "^Loki(High|Critical)DiskUsage$"
    by_deployment_type:
      docker-vm:
        - "ssh deploy@{instance_host} 'docker exec loki rm -rf /loki/chunks/index/$(ls /loki/chunks/index | head -3)' — drop oldest 3 days of indexes (irreversible — only when compliant with retention policy)"
        - "Edit /opt/monitoring/loki/config.yml: lower `limits_config.retention_period` to 96h, then `docker restart loki` — shorten retention going forward"
        - "If still full: terraform apply -var monitoring_root_volume_gb=<larger> — expand EBS"

  - match: "^LokiIngestionRateLow$"
    by_deployment_type:
      docker-vm:
        - "ssh deploy@{instance_host} 'docker restart loki otel-collector' — recover the ingest pipeline"
        - "If Loki keeps refusing writes: edit /opt/monitoring/loki/config.yml `limits_config.ingestion_rate_mb` higher, restart Loki"

  # ---- Drain3 anomaly --------------------------------------------------
  # Drain3 fires on novel log templates. These are not metric breaches —
  # they're SIGNALS that something new is happening in the logs. The
  # operational play is investigate → correlate → verdict (see the Drain3
  # playbook block in app/llm_client.py SYSTEM_PROMPT). When the LLM
  # produces a concrete RCA, it should also produce a remediation action
  # tied to the identified failure mode (those actions don't fall back to
  # this template).
  #
  # The fallback below applies when the LLM produces NO concrete actions —
  # which for Drain3 means it didn't find a correlation. In that case the
  # right output is a SHELVE marker, not a generic restart. A shelved
  # anomaly will be revisited the next time the same template fires;
  # if it recurs ≥3 times in 7 days the LLM is told to escalate it
  # regardless. Restart-as-default is a guess, and Lina's audit found
  # those guesses confused operators more than they helped.
  - match: "^Drain3AnomalyDetected$"
    by_deployment_type:
      k8s:
        - "Shelved — no correlation between this log-template novelty and metric/trace anomalies in the same window. No action this round; if the same template fires again the recurrence counter will surface it for re-investigation. If it crosses ≥3 fires in 7 days the system will escalate automatically."
      docker-vm:
        - "Shelved — no correlation between this log-template novelty and metric/trace anomalies in the same window. No action this round; if the same template recurs ≥3 times in 7 days the system will escalate automatically."
      systemd:
        - "Shelved — no correlation between this log-template novelty and metric/trace anomalies in the same window. No action this round; if the same template recurs ≥3 times in 7 days the system will escalate automatically."
      unknown:
        - "Shelved — no correlation found, no remediation issued. Awaiting recurrence."

  # ---- Default catch-all ----------------------------------------------
  # When the alertname doesn't match any specific rule, the safest universal
  # remedy is "restart the offending workload" — but only at the right layer.
  # Empty for unknown deployment types (no vague advice).
  - match: "^.*$"
    by_deployment_type:
      k8s:
        - "kubectl rollout restart deploy/{service} -n app — universal first-line remedy for k8s services"
      docker-vm:
        - "ssh deploy@{instance_host} 'docker restart <container>' — universal first-line remedy for docker-vm services (container name in evidence)"
      systemd:
        - "ssh deploy@{instance_host} 'sudo systemctl restart {service}' — universal first-line remedy for systemd services"
      unknown: []
